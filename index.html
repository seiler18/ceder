<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-*)` deje de
       valer cero en los teléfonos con notch. Sin él, la barra inferior de
       navegación queda debajo de la raya del gesto y no se puede pulsar.
       Lo aprovecha responsive.css; en el resto de teléfonos no cambia nada. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>CEDER SpA | Consultoría, auditoría y planificación estratégica</title>
  <meta name="description" content="Centro de estudios que asesora a organismos públicos, empresas y gremios de todo Chile en consultoría, auditoría y planificación estratégica.">
  <meta name="author" content="CEDER SpA">

  <link rel="icon" type="image/webp" href="./assets/img/favicon.webp">

  <!-- ============================================================
       SEGURIDAD DEL DOCUMENTO

       GitHub Pages sirve archivos estáticos y NO deja poner cabeceras HTTP,
       así que lo único que se puede endurecer va en <meta>. Tres avisos para
       quien lo toque:

       · `frame-ancestors` y `X-Frame-Options` se IGNORAN en <meta>: solo
         valen como cabecera HTTP. No los añadas aquí creyendo que protegen.
       · `script-src` es solo 'self', sin 'unsafe-inline' ni CDN: es lo que
         convierte cualquier HTML inyectado en inofensivo, porque un atributo
         `onerror` o una etiqueta script colada ya no se ejecutan. Se puede
         porque Vite 8 no escribe ningún script en línea (ni en el build ni en
         `npm run dev`: el polyfill de modulepreload va DENTRO del chunk de
         entrada), el JSON-LD es un bloque de datos que la CSP no trata como
         script, y Font Awesome es una hoja de estilo, no un script. Si algún
         día hace falta un script en línea, `npm run check` (punto 17) lo
         para: en producción moriría en silencio.
         `style-src` sí necesita 'unsafe-inline': en `npm run dev` Vite
         inyecta el CSS como <style>, y los estilos en atributo `style=` son
         la forma natural de pasar una variable CSS desde un componente.
       · Al añadir CUALQUIER servicio externo (analítica, mapa, tipografía,
         vídeo, formulario), su dominio tiene que entrar en la directiva que
         corresponda. Un dominio que falta no da más señal que una línea roja
         en la consola: el widget simplemente no aparece.
         → Ver referencia/seguridad.md de WebMaker.
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; upgrade-insecure-requests">
  <!-- Al salir a un enlace externo se manda el origen, nunca la ruta completa. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Redes sociales. og:image debe ser una URL ABSOLUTA: las relativas no
       las resuelve ni WhatsApp ni LinkedIn y la tarjeta sale sin imagen. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="CEDER SpA">
  <meta property="og:title" content="CEDER SpA | Consultoría, auditoría y planificación estratégica">
  <meta property="og:description" content="Centro de estudios que asesora a organismos públicos, empresas y gremios de todo Chile en consultoría, auditoría y planificación estratégica.">
  <meta property="og:url" content="https://seiler18.github.io/ceder/">
  <meta property="og:image" content="https://seiler18.github.io/ceder/assets/img/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Portada del sitio de CEDER SpA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CEDER SpA | Consultoría, auditoría y planificación estratégica">
  <meta name="twitter:description" content="Centro de estudios que asesora a organismos públicos, empresas y gremios de todo Chile en consultoría, auditoría y planificación estratégica.">
  <meta name="twitter:image" content="https://seiler18.github.io/ceder/assets/img/og.jpg">

  <!-- Tipografía. `display=swap` enseña el texto con la fuente del sistema
       mientras la real carga, en vez de dejar un hueco en blanco. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

  <!-- Iconos (Font Awesome 6). Es la versión de referencia para elegir
       clases: `fa-solid fa-x`, `fa-brands fa-x`. -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

  <!-- Punto de montaje: TODO el markup lo genera src/main.js a partir de
       src/site-map.js. No añadas secciones aquí. -->
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
