<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-*)` deje de
       valer cero en los teléfonos con notch. Sin él, la barra inferior de
       navegación queda debajo de la raya del gesto y no se puede pulsar.
       Lo aprovecha responsive.css; en el resto de teléfonos no cambia nada. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>CEDER SpA | Consultoría, auditoría y planificación estratégica</title>
  <meta name="description" content="Centro de estudios que asesora a organismos públicos, empresas y gremios de todo Chile en consultoría, auditoría y planificación estratégica.">
  <meta name="author" content="CEDER SpA">

  <link rel="icon" type="image/webp" href="./assets/img/favicon.webp">

  <!-- Redes sociales. og:image debe ser una URL ABSOLUTA: las relativas no
       las resuelve ni WhatsApp ni LinkedIn y la tarjeta sale sin imagen. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CEDER SpA | Consultoría, auditoría y planificación estratégica">
  <meta property="og:description" content="Centro de estudios que asesora a organismos públicos, empresas y gremios de todo Chile en consultoría, auditoría y planificación estratégica.">
  <meta property="og:url" content="https://seiler18.github.io/ceder/">
  <meta property="og:image" content="https://seiler18.github.io/ceder/assets/img/og.webp">

  <!-- Tipografía. `display=swap` enseña el texto con la fuente del sistema
       mientras la real carga, en vez de dejar un hueco en blanco. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

  <!-- Iconos (Font Awesome 6). Es la versión de referencia para elegir
       clases: `fa-solid fa-x`, `fa-brands fa-x`. -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

  <!-- Punto de montaje: TODO el markup lo genera src/main.js a partir de
       src/site-map.js. No añadas secciones aquí. -->
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
